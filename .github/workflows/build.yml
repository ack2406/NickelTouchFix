name: Build
on: [push, pull_request]

jobs:
  build:
    name: Build NickelTouchFix
    runs-on: ubuntu-latest
    container: ghcr.io/pgaskin/nickeltc:1.0
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Inject version string
      run: |
        set -x
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch -f --prune --unshallow --tags || true
        echo "VERSION=$(git describe --tags --always --abbrev=5)" >> $GITHUB_ENV

    - name: Build
      run: make clean && make all koboroot

    - name: Upload KoboRoot
      uses: actions/upload-artifact@v5
      with:
        name: NickelTouchFix-${{ env.VERSION }}
        path: KoboRoot.tgz

    - name: Zip KoboRoot
      run: zip NickelTouchFix-${{ env.VERSION }}.zip KoboRoot.tgz

    - name: Create Release
      uses: softprops/action-gh-release@v2.4.2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: NickelTouchFix-${{ env.VERSION }}.zip
        draft: true
        fail_on_unmatched_files: true
